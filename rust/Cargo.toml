[package]
name = "calc_flut_core"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
bigdecimal = "0.4"
# Exact symbolic mathematics: expression trees, simplification, expansion,
# factorisation, calculus and equation solving over Ratio<BigInt>.
symplex = "0.28"
# The modular kernel under modular_arithmetic/. It multiplies through a full
# double-width intermediate, which is what keeps a large modulus exact; the
# hand-rolled i128 kernel wrapped instead, silently, because the release profile
# compiles with overflow checks off.
#
# `num-bigint` is required for the BigUint backend. `std` stays off — the crate
# is no_std, and there is nothing here that needs a hosted target. num-bigint
# already pulls in num-integer and num-traits, so neither is named here.
num-modular = { version = "0.6.5", default-features = false, features = ["num-bigint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window"] }
# Pulled in transitively by symplex (via astro-float -> rand). Left at its
# default, getrandom refuses to compile for wasm because it has no way to reach
# the host's entropy source. Naming it here with the `js` feature turns that
# around: on the web, randomness comes from the browser instead. Cargo unifies
# features across the graph, so this covers the transitive copies too.
getrandom = { version = "0.2", features = ["js"] }
